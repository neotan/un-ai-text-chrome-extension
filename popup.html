<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unAI Text Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <img src="icons/icon.svg" class="logo-icon-img" alt="Un-AI Text" width="22" height="22">
        <span class="brand-title">Un-AI Text</span>
      </div>
      <a href="https://un-ai-text.com" target="_blank" class="web-link">
        <span>Web App</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
      </a>
    </header>

    <main class="main-body">
      <div class="input-card">
        <textarea id="test-input" placeholder="Paste or type text to check AI risk & clean clichés..." rows="4"></textarea>
        <div class="textarea-footer">
          <span id="char-count">0 chars</span>
          <button id="btn-analyze" class="btn-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
            <span>Instant Scan</span>
          </button>
        </div>
      </div>

      <div id="results-card" class="results-card hidden">
        <div class="result-header">
          <div class="gauge-wrap">
            <span id="res-score" class="score-val">0%</span>
            <span id="res-label" class="score-label">Human</span>
          </div>
          <div class="result-meta">
            <div id="res-cliches-count" class="meta-item">0 Clichés</div>
            <div id="res-academic-badge" class="meta-item meta-academic hidden">
              <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
              <span>LaTeX Protected</span>
            </div>
          </div>
        </div>

        <div id="cliche-preview" class="cliche-preview hidden"></div>

        <div class="action-buttons">
          <button id="btn-clean" class="btn-secondary">
            <svg class="btn-icon text-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" /><path d="M20 3v4" /><path d="M22 5h-4" /><path d="M4 17v2" /><path d="M5 18H3" /></svg>
            <span>Clean Clichés</span>
          </button>
          <button id="btn-deep-rewrite" class="btn-dark">
            <span>Deep Humanize on Web</span>
            <svg class="btn-icon arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
          </button>
        </div>
      </div>

      <div class="settings-section">
        <label class="toggle-row">
          <span>Show floating bubble on text selection</span>
          <input type="checkbox" id="toggle-bubble" checked>
        </label>
        <div class="quota-row">
          <span>Daily Scans:</span>
          <span id="quota-val">0 / 5 Used</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <a href="https://chromewebstore.google.com/detail/unai-text" target="_blank" class="cws-link">
        <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>Rate 5 Stars on Chrome Store</span>
      </a>
    </footer>
  </div>

  <script src="cliches.js"></script>
  <script src="prepass.js"></script>
  <script src="academic-guard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
