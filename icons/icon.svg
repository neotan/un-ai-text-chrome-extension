<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradient: cobalt navy to bright cyan -->
    <linearGradient id="icon-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163474"/>
      <stop offset="25%" stop-color="#1c4494"/>
      <stop offset="65%" stop-color="#1e68ca"/>
      <stop offset="90%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Subtle top highlight for 3D glassy tactile sheen -->
    <linearGradient id="icon-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft 3D drop shadow for the white emblem -->
    <filter id="emblem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0a193c" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#081430" flood-opacity="0.22"/>
    </filter>

    <!-- Emblem 3D surface gradient -->
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#icon-bg-grad)"/>
  
  <!-- Subtle Top Sheen Overlay -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#icon-sheen)"/>

  <!-- Subtle border stroke -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Emblem Group with scale and center -->
